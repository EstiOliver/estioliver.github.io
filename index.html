<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kukersite unlock</title>
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#e8e8e8; --dim:#7b7d7b; --line:#2a2c2a; --acc:#ffd60a; --ok:#30d158; --bad:#ff453a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width:30rem; margin:0 auto; padding:1.25rem 1rem 3rem; }
  h1 { font-size:1.1rem; font-weight:400; letter-spacing:.15em; margin:0 0 .25rem; }
  .sub { color:var(--dim); margin:0 0 1.25rem; font-size:.85rem; }
  .card { border:1px solid var(--line); padding:1rem; margin:0 0 1rem; }
  label { display:block; color:var(--dim); font-size:.8rem; margin:0 0 .35rem; }
  input, textarea { width:100%; background:#0b0b0b; color:var(--fg); border:1px solid var(--line); padding:.6rem; font:inherit; border-radius:0; }
  textarea { min-height:5.5rem; resize:vertical; }
  button { background:none; color:var(--fg); border:1px solid var(--fg); padding:.6rem 1rem; font:inherit; cursor:pointer; border-radius:0; margin:.25rem .5rem .25rem 0; }
  button:disabled { color:var(--dim); border-color:var(--line); cursor:default; }
  .words { display:grid; grid-template-columns:repeat(2,1fr); gap:.35rem 1rem; font-size:1.2rem; margin:.5rem 0 1rem; }
  .words span { color:var(--dim); margin-right:.5rem; }
  #status { min-height:1.5rem; margin:.5rem 0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  pre { white-space:pre-wrap; margin:0; font:inherit; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>KUKERSITE</h1>
  <p class="sub">firmware companion &middot; runs in this page, nothing is uploaded</p>

  <div id="unsupported" class="card bad" hidden>
    This browser has no Web Bluetooth. Use Chrome on Android, or the Bluefy browser on iPhone.
  </div>

  <section id="wordsView" class="card" hidden>
    <label>your 6 words &mdash; shown once, save them to your password manager</label>
    <div id="wordsList" class="words"></div>
    <button id="copyBtn">Copy words</button>
    <p class="dim" style="margin:.5rem 0 0;font-size:.8rem">The link that opened this page has been cleared from the address bar. Clear your scanner history too.</p>
  </section>

  <section id="unlockView" class="card">
    <label for="code">pair code (shown on the stick, 8 characters)</label>
    <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="4F7A2C91">
    <label for="words" style="margin-top:.9rem">your 6 words</label>
    <textarea id="words" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="mango tide olive raven cedar lamp"></textarea>
    <button id="goBtn">Unlock stick</button>
    <div id="status" class="dim"></div>
  </section>

  <section id="sessionView" class="card" hidden>
    <label>connected</label>
    <button id="syncBtn">Sync clock</button>
    <button id="evtBtn">Read alerts</button>
    <pre id="out" class="dim"></pre>
  </section>
</main>

const SERVICE = "7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f01";
const CH = { key:"7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f02", rx:"7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f03",
             res:"7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f04", time:"7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f05",
             evt:"7d2b9f10-5c3e-4a8b-9d6f-1e0a4c7b2f06" };
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
const setStatus = (t, cls) => { const s = $("status"); s.textContent = t; s.className = cls || "dim"; };
const concat = (...parts) => { const o = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let q = 0; for (const p of parts) { o.set(p, q); q += p.length; } return o; };
let session = null;

// ---- link handling: #w=<12 base36> shows the words, #u=<8 hex> prefills the pair code
(function init() {
  if (!navigator.bluetooth) $("unsupported").hidden = false;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("w") && /^[0-9a-z]{12}$/.test(h.get("w"))) {
    const w = h.get("w"), words = [];
    for (let i = 0; i < 6; i++) words.push(WORDS[parseInt(w.slice(i * 2, i * 2 + 2), 36)]);
    if (words.every(Boolean)) {
      $("wordsList").innerHTML = words.map((x, i) => "<div><span>" + (i + 1) + "</span>" + x + "</div>").join("");
      $("wordsView").hidden = false;
      $("words").value = words.join(" ");
      $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(words.join(" ")); $("copyBtn").textContent = "Copied"; } catch (e) { $("copyBtn").textContent = "Copy failed"; } };
    }
  }
  if (h.get("u") && /^[0-9A-Fa-f]{8}$/.test(h.get("u"))) $("code").value = h.get("u").toUpperCase();
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);   // do not keep the words or code in the address bar
})();

function parseWords() {
  const list = $("words").value.toLowerCase().split(/[\s,.;-]+/).filter(Boolean);
  const set = new Set(WORDS);
  if (list.length !== 6) throw new Error("Enter exactly 6 words.");
  for (const w of list) if (!set.has(w) && w !== "yo") throw new Error("'" + w + "' is not in the word list.");
  return list.join(" ").replace("yo yo", "yo-yo");
}

async function unlock() {
  const code = $("code").value.trim().toUpperCase();
  if (!/^[0-9A-F]{8}$/.test(code)) throw new Error("Pair code must be 8 characters (0-9, A-F).");
  const pass = parseWords();
  setStatus("Choose the stick in the Bluetooth list...");
  const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
  setStatus("Connecting...");
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  const chKey = await svc.getCharacteristic(CH.key);
  const keyVal = new Uint8Array((await chKey.readValue()).buffer);
  if (keyVal.length < 81) throw new Error("Unexpected reply from the stick.");
  const stickPub = keyVal.slice(0, 65), mac = keyVal.slice(65, 81);

  // the stick proves it knows the one-time code shown on its screen
  const hk = await crypto.subtle.importKey("raw", enc.encode(code), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const expect = new Uint8Array(await crypto.subtle.sign("HMAC", hk, stickPub)).slice(0, 16);
  let diff = 0; for (let i = 0; i < 16; i++) diff |= expect[i] ^ mac[i];
  if (diff) throw new Error("This is not the stick showing that code. Check the pair code.");

  const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const phonePub = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey));
  const stickKey = await crypto.subtle.importKey("raw", stickPub, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const shared = new Uint8Array(await crypto.subtle.deriveBits({ name: "ECDH", public: stickKey }, kp.privateKey, 256));
  const keyMat = new Uint8Array(await crypto.subtle.digest("SHA-256", concat(shared, enc.encode(code))));
  const aes = await crypto.subtle.importKey("raw", keyMat, "AES-GCM", false, ["encrypt"]);
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce, additionalData: concat(stickPub, phonePub) }, aes, enc.encode(pass)));

  const chRes = await svc.getCharacteristic(CH.res);
  const chRx = await svc.getCharacteristic(CH.rx);
  const answer = new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("The stick did not answer in time.")), 60000);
    chRes.addEventListener("characteristicvaluechanged", ev => {
      const v = new Uint8Array(ev.target.value.buffer);
      if (v[0] === 0) return;
      clearTimeout(t); resolve({ code: v[0], wait: v[1] | (v[2] << 8) });
    });
  });
  await chRes.startNotifications();
  setStatus("Checking the words on the stick (about a second)...");
  await chRx.writeValueWithResponse(concat(phonePub, nonce, ct));
  const r = await answer;
  if (r.code === 1) { session = { dev, server, svc }; return; }
  if (r.code === 2) throw new Error("Wrong words.");
  if (r.code === 3) throw new Error("Too many wrong tries. Wait " + r.wait + " s.");
  throw new Error("The stick could not read the message. Scan its code again.");
}

$("goBtn").onclick = async () => {
  $("goBtn").disabled = true;
  try {
    await unlock();
    setStatus("Unlocked.", "ok");
    $("sessionView").hidden = false;
  } catch (e) {
    setStatus(e && e.message ? e.message : String(e), "bad");
  } finally {
    $("goBtn").disabled = false;
  }
};

$("syncBtn").onclick = async () => {
  try {
    const d = new Date();
    const ch = await session.svc.getCharacteristic(CH.time);
    await ch.writeValueWithResponse(new Uint8Array([d.getFullYear() & 255, d.getFullYear() >> 8, d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()]));
    $("out").textContent = "Clock set to " + d.toLocaleTimeString() + ".";
  } catch (e) { $("out").textContent = "Could not sync: " + e.message; }
};
$("evtBtn").onclick = async () => {
  try {
    const ch = await session.svc.getCharacteristic(CH.evt);
    $("out").textContent = dec.decode(await ch.readValue());
  } catch (e) { $("out").textContent = "Could not read: " + e.message; }
};
</script>
</body>
